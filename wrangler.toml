name = "swingtheoryv2"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# --- Bindings ---
# Configure the actual resources in the Cloudflare dashboard, then paste
# the resulting IDs here (or set the same names in dashboard → Settings →
# Functions → Bindings). Local dev uses `wrangler pages dev` which creates
# a local SQLite copy for D1 and a filesystem-backed R2 shim.

[[d1_databases]]
binding = "DB"              # env.DB
database_name = "swingtheory"
database_id = "0f458049-0afd-4cff-8d0f-5e5b4c67f164"

[[r2_buckets]]
binding = "MEDIA"           # env.MEDIA
bucket_name = "swingtheory-media"

# --- Environment variables (secrets) ---
# Set via `wrangler pages secret put NAME` or in the dashboard.
# Public (non-secret) values can go under [vars] below.

[vars]
CONTACT_TO_EMAIL = "info@swingtheory.golf"
CONTACT_FROM_EMAIL = "noreply@swingtheory.golf"
# Public R2 CDN base — served either via a custom domain on the bucket
# or via Cloudflare Images. Override per-env.
MEDIA_PUBLIC_BASE = "https://media.swingtheory.golf"
# Cloudflare Access — protects /admin/* at the edge. Both values are
# public identifiers (not secrets). Team domain is the Zero Trust
# subdomain; AUD is the specific Access application's audience tag
# (Zero Trust dashboard → Access → Applications → "Swing Theory Admin").
# functions/lib/access.ts fails closed if either is empty, so both MUST
# be set for admin to work — do NOT clear these.
ACCESS_TEAM_DOMAIN = "plain-cherry-61b1.cloudflareaccess.com"
ACCESS_AUD = "5d184a78afa8977cd8de9b379effd6bb11844b368b5b300652d4a5b3dbe530d0"

# Square membership checkout. Location ID and env mode are not secret —
# the access token is (see below). SANDBOX values while we test the
# Green Jacket Solo checkout flow; swap to the production location ID
# and flip SQUARE_ENV to "production" right before launch.
SQUARE_LOCATION_ID = "LDTYCKQHBQH01"
SQUARE_ENV = "production"

# mm-api provisioning handoff. Called by /api/program-checkout after a
# successful Square payment to create the corresponding user + paid
# enrollment on the Sync side. Base URL is the mm-api-prod Worker; the
# shared secret is INTERNAL_PROVISIONING_SECRET, set separately.
MM_API_BASE_URL = "https://mm-api-prod.swingtheoryla.workers.dev"

# 50%-first-month membership promo toggle. Set to "true" to route
# checkout at the promo Square plan variation (STATIC $ for month 1,
# RELATIVE ongoing after) and show the promo copy on membership cards.
# Any other value = promo off. Must be flipped in TANDEM with
# VITE_MEMBERSHIP_PROMO_ENABLED below so backend charge + frontend copy
# stay aligned. Flip requires a redeploy.
MEMBERSHIP_PROMO_ENABLED = "false"
VITE_MEMBERSHIP_PROMO_ENABLED = "false"

# Square Web Payments SDK, browser-side (VITE_ prefix means these get
# baked into the JS bundle at build time and shipped to every visitor).
# They're PUBLIC by nature — safe to commit here. Sandbox equivalents
# used to be sq0idb-... / LQ77M71PA1N9T / "sandbox".
VITE_SQUARE_APP_ID = "sq0idp-vicpiL2c2tM6uVPMPfpLOQ"
VITE_SQUARE_LOCATION_ID = "LDTYCKQHBQH01"
VITE_SQUARE_ENV = "production"


# Secrets to set separately (NEVER commit):
#   RESEND_API_KEY
#   TURNSTILE_SECRET_KEY
#   SQUARE_ACCESS_TOKEN   (sandbox token for now — swap to production before launch)
#   INTERNAL_PROVISIONING_SECRET  (must match the same-named secret on mm-api-prod)
