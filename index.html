<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#041d13" />
    <link rel="icon" type="image/png" sizes="32x32" href="/32x32.png?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Non-blocking Google Fonts load. rel="preload" + as="style" pulls the
      stylesheet without blocking parse, and the onload swap flips it back
      to `all` so it applies once ready. Fixes the "Render Blocking
      Resources" SEO audit failure and cuts the LCP wait by ~350ms on 4G.
      The <noscript> fallback keeps fonts working for the tiny sliver of
      no-JS visitors.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
      />
    </noscript>
    <title>Indoor Golf Simulators in Old Town Pasadena | Swing Theory</title>
    <meta
      name="description"
      content="Swing Theory is an indoor golf studio in Old Town Pasadena with four wide simulator bays, tour-grade launch monitors, and 100+ world courses. Practice, lessons, leagues, and private events."
    />

    <!--
      Open Graph / Twitter defaults for this shell. In production, every
      public route is prerendered at build time (scripts/prerender.mjs):
      the prerender strips this whole default head block and injects each
      route's own Helmet-rendered tags, so what ships per page is the
      exact <SEO /> output plus JSON-LD. These defaults still cover `vite
      dev` and the spa.html fallback shell that non-prerendered routes
      (checkout, admin, admin-created program slugs) boot from.
      Image is a 1200x630 JPG (Apple Messages doesn't reliably render
      WebP for link previews).
      NOTE: prerender.mjs matches this comment by the words "Open Graph"
      to remove the block — keep those words if you edit it.
    -->
    <meta property="og:title" content="Indoor Golf Simulators in Old Town Pasadena | Swing Theory" />
    <meta property="og:description" content="Swing Theory is an indoor golf studio in Old Town Pasadena with four wide simulator bays, tour-grade launch monitors, and 100+ world courses. Practice, lessons, leagues, and private events." />
    <meta property="og:url" content="https://swingtheory.golf/" />
    <meta property="og:image" content="https://swingtheory.golf/images/home/home-sim-bays-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Swing Theory" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Indoor Golf Simulators in Old Town Pasadena | Swing Theory" />
    <meta name="twitter:description" content="Swing Theory is an indoor golf studio in Old Town Pasadena with four wide simulator bays, tour-grade launch monitors, and 100+ world courses." />
    <meta name="twitter:image" content="https://swingtheory.golf/images/home/home-sim-bays-og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
